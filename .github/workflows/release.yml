name: release

# mavericks-1password is a Porthole PRESET that PORTS 1Password, so it is versioned
# <1password-version>-mavericks.N. 1Password has no public version feed, so UPSTREAM_VERSION is
# HAND-bumped (the container floats to latest at first launch anyway -- UPDATE=float -- so the number
# just names the release). The shipped .pkg is small: the preset conf + menu manifest + the bin/op CLI
# (no compiler, no viewer, no container). Three entry points:
#   - push to main        : build + gate; if UPSTREAM_VERSION has no release yet, auto-cut -mavericks.1
#   - a *-mavericks.* tag  : publish that exact version
#   - workflow_dispatch(local_release=true) : cut a -mavericks.(N+1) repackage

on:
  push:
    branches: [main]
    tags: ['*-mavericks.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a local -mavericks.(N+1) repackage for the current 1Password version"
        type: boolean
        default: false

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# A push to main HERE CAN PUBLISH (an upstream with no release yet auto-cuts -mavericks.1), and
# concurrency is resolved when a run is queued -- before the ver step decides whether this one
# releases -- so cancelling the run would cancel the publish job with it.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26   # pkgbuild/productbuild are macOS-only (the payload is arch-independent)
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "ONEP_DIST_DIR=$RUNNER_TEMP/mm-build/onep-build/dist" >> "$GITHUB_ENV"

      - name: Decide version + whether this run publishes
        id: ver
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VER="$GITHUB_REF_NAME"; PUB=true
          else
            MODE=auto
            if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.local_release }}" = "true" ]; then
              MODE=local
            fi
            OUT="$(sh build/version.sh "$MODE")"
            VER="$(printf '%s\n' "$OUT" | sed -n 's/^FULL=//p')"
            REL="$(printf '%s\n' "$OUT" | sed -n 's/^RELEASE=//p')"
            [ "$GITHUB_REF_NAME" = main ] || REL=no
            [ "$REL" = yes ] && PUB=true || PUB=false
          fi
          { echo "version=$VER"; echo "publish=$PUB"; } >> "$GITHUB_OUTPUT"
          echo "version=$VER publish=$PUB"

      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      # The updater carries the release's version, which Sparkle compares with the feed's. x86_64 for
      # 10.9 only, like Porthole's: this preset installs only where Porthole does.
      - name: Build the Sparkle updater (x86_64 / min-10.9)
        run: |
          set -eu
          app="$(basename "$(sh "$SHIPYARD_SCRIPTS/product-name.sh" updater-app 1password)")"
          sh build/build-updater.sh "${{ steps.ver.outputs.version }}" "$RUNNER_TEMP/$app"
          echo "UPD_APP=$RUNNER_TEMP/$app" >> "$GITHUB_ENV"

      - name: Build the preset .pkg (conf + menu manifest + op CLI + updater)
        run: |
          set -eu
          sh packaging/macos/build_pkg.sh "${{ steps.ver.outputs.version }}" \
             "$ONEP_DIST_DIR/mavericks-1password-${{ steps.ver.outputs.version }}.pkg"

      # --min-os must say what the pkg declares (set_install_floor.sh in packaging/macos/build_pkg.sh).
      - name: Generate release notes
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag "${{ steps.ver.outputs.version }}" --version "${{ steps.ver.outputs.version }}" \
            --product 'Linux 1Password' --min-os 10.9.5 --out "$ONEP_DIST_DIR/RELEASE_NOTES.md"

      - name: Sign the pkg and write the feed
        if: steps.ver.outputs.publish == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh`
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace can print it
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          PKG="$ONEP_DIST_DIR/mavericks-1password-$VER.pkg"
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" --product 1password --feed-dir "$ONEP_DIST_DIR" \
            --channel-title "1Password for Mavericks" --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")" \
            --notes-file "$ONEP_DIST_DIR/RELEASE_NOTES.md" --pkg "$PKG" --min-os 10.9.5

      # Conformance: does the pkg we are about to publish carry the family's identity, install paths,
      # floor and version scheme (INGREDIENTS.md "Conformance deviations" excuses the rest)? A run that
      # doesn't publish has no signed feed, so it checks against an unsigned stand-in.
      - name: Artifact conformance
        env:
          PUB: ${{ steps.ver.outputs.publish }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          [ "$PUB" = true ] || sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" "$ONEP_DIST_DIR" "$VER"
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$ONEP_DIST_DIR" "$VER" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: Assert the feed upgrades installed clients
        if: steps.ver.outputs.publish == 'true'
        run: sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$ONEP_DIST_DIR/1password.xml" --version "${{ steps.ver.outputs.version }}"

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: onepassword
          path: ${{ env.ONEP_DIST_DIR }}/*

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. publish-release.yml looks for this job's record on any signed release.
  scan:
    needs: [build]
    if: always() && (needs.build.outputs.publish == 'true')   # a build that fails after signing left logs too; scan them
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: onepassword
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [build, scan]
    if: needs.build.outputs.publish == 'true'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.version }}
      artifact: onepassword
