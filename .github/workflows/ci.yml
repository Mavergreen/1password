name: CI

# Validate every push and PR: run the BATS suite and build+sanity-check the pkg.
# No publishing here — releases happen only on v* tags (see release.yml).

on:
  push:
  pull_request:

jobs:
  macos:
    name: Test + build pkg
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install mavericks-shipyard
        uses: ModernMavericks/shipyard/.github/actions/install@v1

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Install bats
        run: brew install bats-core

      - name: Run the BATS suite
        run: make test

      - name: Build the pkg and sanity-check it
        run: |
          VER=$(cat VERSION)
          sh packaging/macos/build_pkg.sh "$VER" "mavericks-1password-$VER.pkg"
          pkgutil --payload-files "mavericks-1password-$VER.pkg" | grep -E 'libexec/mavericks-1password/(bin/op|gui/)'
          pkgutil --payload-files "mavericks-1password-$VER.pkg" | grep -E '/usr/local/bin/op$'
          pkgutil --expand "mavericks-1password-$VER.pkg" /tmp/pkgx
          grep -o 'os-version min="[0-9.]*"' /tmp/pkgx/Distribution

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

  # 10.9-safety gate for the native Porthole viewer (bin/op's default GUI client),
  # built through the shared mavericks-shipyard conventions: CI installs it via the
  # @v1 action, and find_package + include(Mavericks) run the AppleClang gate while
  # mavericks_assert_binary_compatible(Porthole) fails the build if the cross-built binary imports a
  # post-10.9 symbol. macos-26 is a modern host -> cross mode.
  cmake-10_9-gate:
    name: CMake 10.9-safety gate (Porthole via mavericks-shipyard)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # shipyard installs itself via its own action (HTTPS via the runner token). The action puts
      # shipyard-cmake on PATH and exports SHIPYARD_SCRIPTS; shipyard-cmake is the only cmake that
      # configures against shipyard, and it supplies the prefix find_package(MavericksShipyard)
      # resolves from, so there is nothing to register and no CMAKE_PREFIX_PATH to set.
      - name: Install mavericks-shipyard
        uses: ModernMavericks/shipyard/.github/actions/install@v1

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Ensure Rosetta (the x86_64 @ 10.9 codec test runs under it)
        run: softwareupdate --install-rosetta --agree-to-license || true

      # Porthole is plain Cocoa/Foundation ObjC (no kext), so the modern SDK +
      # -mmacosx-version-min=10.9 is enough -- no 10.9 SDK fetch needed. The compat
      # guard runs as a build-time POST_BUILD (static otool check; no Rosetta).
      - name: Configure + build (x86_64 @ 10.9) — compat guard gates Porthole
        run: |
          shipyard-cmake --preset cross
          shipyard-cmake --build build-cross
          echo "Porthole slice:"; lipo -info build-cross/porthole/viewer/Porthole.app/Contents/MacOS/Porthole

      - name: Off-device codec test (Rosetta)
        run: shipyard-ctest --preset cross -R '^protocol$' --output-on-failure

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"
