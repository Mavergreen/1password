# 1Password app-specific viewer manifest (shell KEY=value; sourced by bin/generate-viewer).
# The HARD case / reference instance: third-party apt repo, printing (CUPS), ambient
# CAP_SYS_PTRACE for browser-support auth, an app-created group, a browser allowlist,
# extra CLI-support packages, and forced-dark popups. Exercises every template slot.
APP=1Password
NAME=
SLUG=1password
PORT=10000
BASE_IMAGE=debian:13-slim

# Third-party apt repo (AgileBits ship their own). Porthole writes the key to the signed-by path.
APT_KEY_URL=https://downloads.1password.com/linux/keys/1password.asc
APT_REPO='deb [arch=amd64 signed-by=/usr/share/keyrings/1password-desktop-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main'
APT_LIST=1password   # basename of /etc/apt/sources.list.d/<APT_LIST>.list
APT_PKGS='1password 1password-cli'
UPDATE=float   # 1Password self-gates on a server-side minimum version, so pinning
               # would freeze at a version the server later rejects. Float: Renovate follows
               # 1Password's apt repo, and each preset release rebuilds the app at install.

# The in-container app binary + flags. --disable-gpu (no GPU in the container) and an
# explicit --user-data-dir on the persistent volume.
APP_BIN=1password
APP_FLAGS='--disable-gpu --user-data-dir=/home/onepassword/.config/1Password'

# Runtime user + group. The 1password package pre-creates the `onepassword` group;
# USER_GROUP pins useradd -g to it (so the app user matches the package's expectations).
USER=onepassword
USER_GROUP=onepassword
DATADIR=/home/onepassword/.config/1Password
ICON_GLOB='/opt/1Password/resources/icons/hicolor/*/apps/1password.png'
# The app icon until the first launch, fetched from AgileBits by your Mac at install (Porthole never
# ships it): the 180 px web-app icon, the same picture as the package's own (ICON_URL_SOURCE), which
# replaces it once the container has run. The three lines below are check-preset-icons.sh --accept's.
ICON_URL=https://app.1password.com/images/apple-touch-icon-iphone-3x.png
ICON_URL_FINGERPRINT='sha256:2b0db6cd4964ff99c6c30036b731afa1c8e245451ef742fd4b22e1c45a911745 dhash:4cf0d49696d4f0e8 180x180 colour:bfd5e3bfd5e3'
ICON_URL_SOURCE='1password 8.12.46 /opt/1Password/resources/icons/hicolor/256x256/apps/1password.png distance:3'
ICON_URL_ARCHIVE='https://web.archive.org/web/20261121025540id_/https://app.1password.com/images/apple-touch-icon-iphone-3x.png'

# The Mac About menu item opens 1Password's own Settings -> About: a second launch hands this
# settings link to the running app (no D-Bus needed), which shows the About category, locked or not.
ABOUT_CMD='/opt/1Password/1password --user-data-dir=/home/onepassword/.config/1Password onepassword://settings/about'

# Lifecycle: ondemand -- Quit stops the container, as quitting 1Password for Mac stops it. op and the
# SSH agent work only while the app runs, as on a Mac. Kept running instead, a quit 1Password locks
# and stays reachable from the browser extension, whose "Open 1Password" then asks it for a lock
# screen no viewer shows; stopped, the extension opens onepassword://, which launches the app.
LIFECYCLE=ondemand

# Bridges / capabilities.
ENCODINGS=rgb,jpeg   # 1Password's proven pair (rgb alpha + jpeg for photos)
AUDIO=
PRINTING=yes         # CUPS + xpra virtual PDF printer (+ lpadmin usermod + printing ACL fix)
PTRACE=yes           # ambient CAP_SYS_PTRACE: read the browser-support helper's /proc to auth the peer
DARK_THEME=yes       # force dark GTK so 1Password's GTK menus / Chromium dropdowns follow dark mode
OPEN_URL=yes
FILE_TRANSFER=yes
NOTIFICATIONS=yes


# Extra entrypoint env (the app reads these; reproduces gui/start-op-gui.sh's env).
EXTRA_ENV='OP_HOME=/home/onepassword OP_USER_DATA=/home/onepassword/.config/1Password '

# Native Mac behaviour (Porthole's engine tools; see README).
# op on the Mac is 1Password's own CLI, run in the running app's container (porthole-cli).
CLI='op'
CLI_op='/usr/bin/op'
# The schemes 1Password's Linux package registers (its 1password.desktop MimeType).
URL_SCHEMES='onepassword onepassword8'
# The SSH agent exists on the Mac while the app serves it ("Use the SSH agent" ticked).
SOCKETS='ssh-agent'
SOCKET_ssh_agent='/home/onepassword/.1password/agent.sock ~/.1password/agent.sock'
# The browser extension's native host: 1Password's helper, run as uid 1000 / gid 0 (not the
# onepassword group, so its setgid changes egid and its secure-mode check passes), allowed the
# browsers we pre-seed plus the user's own root-owned list.
NATIVE_HOSTS='browser'
NATIVE_HOST_browser='/opt/1Password/1Password-BrowserSupport 1000:0'
NATIVE_HOST_browser_FILE='/etc/1password/custom_allowed_browsers /usr/local/mavergreen/1password/share/1password/preseeded_browsers /etc/1password/custom_allowed_browsers'
# The menu bar shows 1Password's own macOS menu-bar pictures (shipped in the Linux package too, unused
# there) for the tray pictures it shows: unlocked, locked, and asking for approval.
MENUBAR_ART='unlocked locked prompt'
MENUBAR_ART_unlocked='/opt/1Password/resources/app.asar:/images/tray_unlocked.png /opt/1Password/resources/app.asar:/images/application_icons/macos_menubar/appicon_16_monochrome_unlocked_Template@2x.png'
MENUBAR_ART_locked='/opt/1Password/resources/app.asar:/images/tray_locked.png /opt/1Password/resources/app.asar:/images/application_icons/macos_menubar/appicon_16_monochrome_locked_Template@2x.png'
MENUBAR_ART_prompt='/opt/1Password/resources/app.asar:/images/tray_prompt.png /opt/1Password/resources/app.asar:/images/application_icons/macos_menubar/appicon_16_monochrome_notification_Template@2x.png'
