# 1Password app-specific viewer manifest (shell KEY=value; sourced by bin/generate-viewer).
# The HARD case / reference instance: third-party apt repo, printing (CUPS), ambient
# CAP_SYS_PTRACE for browser-support auth, an app-created group, a browser allowlist,
# extra CLI-support packages, and forced-dark popups. Exercises every template slot.
APP=1Password
NAME=
SLUG=1password
PORT=10000
BASE_IMAGE=debian:13-slim

# Third-party apt repo (AgileBits ship their own). Porthole writes the key to the signed-by path.
APT_KEY_URL=https://downloads.1password.com/linux/keys/1password.asc
APT_REPO='deb [arch=amd64 signed-by=/usr/share/keyrings/1password-desktop-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main'
APT_LIST=1password   # basename of /etc/apt/sources.list.d/<APT_LIST>.list
APT_PKGS='1password 1password-cli'
UPDATE=float   # 1Password self-gates on a server-side minimum version, so pinning
               # would freeze at a version the server later rejects; float + the
               # staleness nudge is the honest policy (see doctrine slice C).

# The in-container app binary + flags. --disable-gpu (no GPU in the container) and an
# explicit --user-data-dir on the persistent volume.
APP_BIN=1password
APP_FLAGS='--disable-gpu --user-data-dir=/home/onepassword/.config/1Password'

# Runtime user + group. The 1password package pre-creates the `onepassword` group;
# USER_GROUP pins useradd -g to it (so the app user matches the package's expectations).
USER=onepassword
USER_GROUP=onepassword
DATADIR=/home/onepassword/.config/1Password
ICON_GLOB='/opt/1Password/resources/icons/hicolor/*/apps/1password.png'
# The app icon, fetched from AgileBits by your Mac at install (Porthole never ships it). Only 180 px;
# the app's own 512 px from its container replaces it after the first launch.
ICON_URL=https://1password.com/apple-touch-icon.png

# Lifecycle: stayup -- the container also backs the `op` CLI + ssh-agent, so it must
# NOT stop when the GUI viewer quits (contrast Signal/Thunderbird's ondemand).
LIFECYCLE=stayup

# Bridges / capabilities.
ENCODINGS=rgb,jpeg   # 1Password's proven pair (rgb alpha + jpeg for photos)
AUDIO=
PRINTING=yes         # CUPS + xpra virtual PDF printer (+ lpadmin usermod + printing ACL fix)
PTRACE=yes           # ambient CAP_SYS_PTRACE: read the browser-support helper's /proc to auth the peer
DARK_THEME=yes       # force dark GTK so 1Password's GTK menus / Chromium dropdowns follow dark mode
OPEN_URL=yes
FILE_TRANSFER=yes
NOTIFICATIONS=yes

# CLI-support packages (bin/op drives the app via xdotool/wmctrl on :100; x11-utils for xwininfo).
EXTRA_PKGS='xdotool wmctrl x11-utils'

# Extra entrypoint env (the app reads these; reproduces gui/start-op-gui.sh's env).
EXTRA_ENV='OP_HOME=/home/onepassword OP_USER_DATA=/home/onepassword/.config/1Password '

# Extra Docker build setup (verbatim RUN lines). 1Password verifies the browser peer's
# process name against a supported-browser allowlist; socat (the ssh-agent/tunnel bridge)
# isn't on it, so allow socat + its resolved binary socat1 (the /proc/exe target).
EXTRA_SETUP='# Allow the browser-support helper'"'"'s parent (socat) through 1Password'"'"'s
# name+permission browser verification (its supported custom-browser allowlist).
# socat1 is the resolved binary behind /usr/bin/socat (the symlink target the
# verifier reads via /proc/exe); allow both names.
RUN mkdir -p /etc/1password && printf '"'"'socat\nsocat1\n'"'"' > /etc/1password/custom_allowed_browsers'
